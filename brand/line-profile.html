<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 640px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(420px 420px at 70% 20%, #9b82ff, transparent 70%), linear-gradient(135deg, #2a1f5c, #120f24); display: grid; place-items: center; }
  .cal { width: 380px; height: 360px; border-radius: 56px; background: #fff; position: relative; box-shadow: 0 30px 60px rgba(0,0,0,.35); overflow: hidden; }
  .top { height: 104px; background: linear-gradient(90deg, #7a5cff, #ff4d8d); }
  .rings { position: absolute; top: -26px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 70px; }
  .rings i { width: 30px; height: 64px; border-radius: 15px; background: #ffd34d; display: block; }
  .radar { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); width: 190px; height: 190px; }
  .radar span { position: absolute; inset: 0; border-radius: 50%; border: 10px solid #ff4d8d; opacity: .9; }
  .radar span:nth-child(2) { inset: 38px; border-color: #7a5cff; }
  .radar b { position: absolute; inset: 72px; border-radius: 50%; background: #ff4d8d; }
</style></head>
<body><div class="cal"><div class="top"></div><div class="rings"><i></i><i></i></div>
  <div class="radar"><span></span><span></span><b></b></div></div></body></html>
