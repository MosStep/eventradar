<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1080px; height: 878px; overflow: hidden; font-family: "Mitr", sans-serif; color: #fff; }
  body { background: radial-gradient(700px 500px at 85% 10%, rgba(255,77,141,.55), transparent 70%),
    radial-gradient(600px 500px at 10% 90%, rgba(122,92,255,.6), transparent 70%), #120f24; position: relative; }
  .wrap { position: absolute; left: 90px; top: 210px; right: 90px; }
  h1 { margin: 0; font-size: 120px; font-weight: 600; letter-spacing: -1px; }
  h1 span { background: linear-gradient(90deg, #9b82ff, #ff5c9a); -webkit-background-clip: text; color: transparent; }
  p { margin: 18px 0 0; font-size: 46px; font-weight: 400; color: #e4ddff; }
  .chips { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 16px; }
  .chips b { font-weight: 400; font-size: 32px; padding: 12px 26px; border-radius: 999px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); }
  .flags { position: absolute; right: 90px; bottom: 80px; font-size: 64px; letter-spacing: 12px; }
</style></head>
<body><div class="wrap">
  <h1>Event<span>Radar</span></h1>
  <p>รวมงานอีเวนต์ ไทย · ญี่ปุ่น · จีน อัปเดตทุกวัน</p>
  <div class="chips"><b>🌸 อนิเมะ</b><b>🎮 เกม</b><b>🎤 คอนเสิร์ต</b><b>💌 แฟนมีต</b><b>🍜 เทศกาล</b></div>
</div><div class="flags">🇹🇭🇯🇵🇨🇳</div></body></html>
