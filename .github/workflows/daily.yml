# Runs the event pipeline every day and publishes the app to GitHub Pages.
# Needs repo secret TENIXE_KEYS, and Settings → Pages → Source: GitHub Actions.
name: daily-update
on:
  schedule:
    # Every 3 hours at :23 — GitHub runs schedules best-effort and often drops/delays the busy :00 slot,
    # so off-peak minutes and more frequent runs keep updates flowing even when one is skipped.
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "data/**"]

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        id: tests
        continue-on-error: true
        run: node --test tests/*.test.mjs
      - name: Fetch and extract events
        id: pipeline
        if: github.event_name != 'push'
        continue-on-error: true # a failed run must not stop the site from deploying
        env:
          TENIXE_KEYS: ${{ secrets.TENIXE_KEYS }}
          TENIXE_NEMOTRON_KEYS: ${{ secrets.TENIXE_NEMOTRON_KEYS }}
          AIU_KEYS: ${{ secrets.AIU_KEYS }}
          # AIUnlimit is shared: GitHub uses 30 requests a minute, the local loop 50 (scripts/loop.ps1), charforge up to 40.
          AIU_RPM: 30
          AIU_CONCURRENCY: ${{ vars.AIU_CONCURRENCY }}
        run: node pipeline/run.mjs --window=1d --max-batches=5 --max-describe=10 --max-verify=20 --max-price=20 --split=5 --budget-min=90
      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "eventradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update"
          # Up to 5 attempts: fetch, rebase onto origin/main, resolve conflicts under data/ in favour of this run's
          # files, check that the merged JSON parses, then push. A conflict anywhere else aborts and fails the step.
          resolve_rebase() {
            guard=0
            while [ -d "$(git rev-parse --git-dir)/rebase-merge" ] || [ -d "$(git rev-parse --git-dir)/rebase-apply" ]; do
              guard=$((guard + 1))
              if [ "$guard" -gt 50 ]; then git rebase --abort || true; return 1; fi
              conflicts=$(git diff --name-only --diff-filter=U)
              other=$(printf '%s\n' "$conflicts" | grep -v '^data/' | grep -v '^$' || true)
              if [ -n "$other" ]; then
                echo "::error::rebase conflict outside data/, aborting:"
                echo "$other"
                git rebase --abort || true
                return 1
              fi
              for f in $conflicts; do git checkout --theirs -- "$f" || true; done
              git add -A data # also stages deletions and additions that have no "theirs" file
              if git diff --cached --quiet; then
                git rebase --skip || true
              else
                GIT_EDITOR=true git rebase --continue || true
              fi
            done
            return 0
          }
          published=0
          for attempt in 1 2 3 4 5; do
            before=$(git rev-parse HEAD)
            if ! git fetch -q origin main; then
              echo "fetch failed (attempt $attempt)"
              sleep $((RANDOM % 20 + 5))
              continue
            fi
            git rebase -q origin/main || true
            if ! resolve_rebase; then exit 1; fi
            if ! node -e "JSON.parse(require('fs').readFileSync('data/events.json','utf8'));JSON.parse(require('fs').readFileSync('data/raw.json','utf8'))"; then
              echo "::warning::merged JSON invalid (attempt $attempt), undoing this attempt"
              git reset -q --hard "$before"
              sleep $((RANDOM % 20 + 5))
              continue
            fi
            if git push -q origin HEAD:main; then
              published=1
              break
            fi
            echo "push rejected (attempt $attempt), retrying"
            sleep $((RANDOM % 20 + 5))
          done
          if [ "$published" != 1 ]; then echo "::error::data not published after 5 attempts"; exit 1; fi
      # Problems become a GitHub issue, which GitHub e-mails to the repo owner. One open issue at a time, updated in place.
      - name: Report problems
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: node scripts/report.mjs
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/events.json _site/data/
          cp -r data/ics data/e _site/data/ 2>/dev/null || true
          cp data/status.json _site/data/ 2>/dev/null || true
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html # cache-bust app.js and style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
