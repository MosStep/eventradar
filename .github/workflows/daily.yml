# Runs the event pipeline every day and publishes the app to GitHub Pages.
# Needs repo secret TENIXE_KEYS, and Settings → Pages → Source: GitHub Actions.
name: daily-update
on:
  schedule:
    - cron: "0 17,23,5,11 * * *" # 00:00, 06:00, 12:00, 18:00 Thai time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "data/**"]

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        id: tests
        continue-on-error: true
        run: node --test tests/*.test.mjs
      - name: Fetch and extract events
        id: pipeline
        if: github.event_name != 'push'
        continue-on-error: true # a failed run must not stop the site from deploying
        env:
          TENIXE_KEYS: ${{ secrets.TENIXE_KEYS }}
          TENIXE_NEMOTRON_KEYS: ${{ secrets.TENIXE_NEMOTRON_KEYS }}
        run: node pipeline/run.mjs --window=1d --max-batches=5 --max-describe=10 --max-verify=20 --max-price=20
      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "eventradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily update"
          git pull --rebase -X theirs || git rebase --abort
          git push
      # Problems become a GitHub issue, which GitHub e-mails to the repo owner. One open issue at a time, updated in place.
      - name: Report problems
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE: ${{ steps.pipeline.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: node scripts/report.mjs
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/events.json _site/data/
          cp -r data/ics data/e _site/data/ 2>/dev/null || true
          cp data/status.json _site/data/ 2>/dev/null || true
          sed -i "s/__V__/${GITHUB_SHA::7}/g" _site/index.html # cache-bust app.js and style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
